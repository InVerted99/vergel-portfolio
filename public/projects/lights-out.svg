<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Phone with outage report screen beside a glowing map pin">
  <defs>
    <radialGradient id="g" cx="68%" cy="38%" r="55%">
      <stop offset="0" stop-color="#c6f432" stop-opacity=".55"/>
      <stop offset="1" stop-color="#c6f432" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c20"/><stop offset="1" stop-color="#111113"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="#0a0a0b"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect width="1600" height="1000" fill="url(#g)"/>
  <!-- map roads -->
  <g fill="none" stroke="#eeede7" stroke-opacity=".12" stroke-width="10" stroke-linecap="round">
    <path d="M820 120c120 180 260 220 420 240s220 120 300 260"/>
    <path d="M760 880c140-160 300-200 460-180s240-60 320-180"/>
    <path d="M1020 60l80 900"/>
  </g>
  <!-- map pin -->
  <g transform="translate(1100 330)">
    <circle r="150" fill="#c6f432" fill-opacity=".08"/>
    <circle r="90" fill="#c6f432" fill-opacity=".14"/>
    <path d="M0 60c-60-70-90-110-90-150a90 90 0 0 1 180 0c0 40-30 80-90 150Z" fill="#c6f432"/>
    <path d="M-10-120l-28 52h26l-8 44 40-60h-26l10-36Z" fill="#0a0a0b"/>
  </g>
  <!-- phone -->
  <g transform="translate(260 110) rotate(-6)">
    <rect width="420" height="820" rx="56" fill="url(#phone)" stroke="#2a2a30" stroke-width="4"/>
    <rect x="150" y="26" width="120" height="22" rx="11" fill="#0a0a0b"/>
    <text x="40" y="130" fill="#9d9d95" font-family="monospace" font-size="20" letter-spacing="3">REPORT OUTAGE</text>
    <text x="40" y="196" fill="#eeede7" font-family="Arial, sans-serif" font-weight="700" font-size="46">Lights out?</text>
    <text x="40" y="244" fill="#9d9d95" font-family="Arial, sans-serif" font-size="24">Tell us where.</text>
    <rect x="40" y="290" width="340" height="230" rx="28" fill="#0a0a0b" stroke="#2a2a30" stroke-width="2"/>
    <g stroke="#eeede7" stroke-opacity=".15" stroke-width="6" fill="none"><path d="M60 460c80-60 160-40 300-120"/><path d="M200 300v210"/></g>
    <circle cx="230" cy="400" r="14" fill="#c6f432"/>
    <circle cx="230" cy="400" r="34" fill="#c6f432" fill-opacity=".2"/>
    <rect x="40" y="550" width="160" height="56" rx="28" fill="#1c1c20" stroke="#2a2a30"/>
    <text x="70" y="586" fill="#eeede7" font-family="Arial, sans-serif" font-size="22">No power</text>
    <rect x="216" y="550" width="164" height="56" rx="28" fill="#1c1c20" stroke="#2a2a30"/>
    <text x="242" y="586" fill="#eeede7" font-family="Arial, sans-serif" font-size="22">Flickering</text>
    <rect x="40" y="680" width="340" height="80" rx="40" fill="#c6f432"/>
    <text x="210" y="730" text-anchor="middle" fill="#0a0a0b" font-family="Arial, sans-serif" font-weight="700" font-size="28">Send report</text>
  </g>
</svg>
