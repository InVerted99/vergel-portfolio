<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Markdown reader with a highlighted code block and an outline sidebar">
  <defs>
    <radialGradient id="g" cx="72%" cy="30%" r="55%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".45"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="#0a0a0b"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
