    <text x="220" y="280" fill="#eeede7" font-size="52" font-weight="700"># Getting started</text>
    <rect x="220" y="320" width="640" height="14" rx="7" fill="#2a2a30"/>
    <rect x="220" y="350" width="560" height="14" rx="7" fill="#2a2a30"/>
