      <rect x="220" y="398" width="28" height="28" rx="6" fill="#38bdf8"/>
      <path d="M227 412l6 6 10-12" stroke="#0a0a0b" stroke-width="4" fill="none"/>
      <text x="266" y="421">Install dependencies</text>
      <rect x="220" y="448" width="28" height="28" rx="6" fill="none" stroke="#9d9d95" stroke-width="2"/>
      <text x="266" y="471" fill="#9d9d95">Write the docs</text>
    </g>
    <rect x="220" y="510" width="760" height="300" rx="20" fill="#0a0a0b" stroke="#2a2a30" stroke-width="2"/>
    <text x="950" y="545" fill="#9d9d95" font-family="monospace" font-size="16" text-anchor="end">js</text>
    <g font-family="monospace" font-size="26">
      <text x="250" y="580"><tspan fill="#f472b6">import</tspan><tspan fill="#eeede7"> { render } </tspan><tspan fill="#f472b6">from</tspan><tspan fill="#a3e635"> "./md"</tspan><tspan fill="#eeede7">;</tspan></text>
      <text x="250" y="640"><tspan fill="#f472b6">const</tspan><tspan fill="#38bdf8"> html</tspan><tspan fill="#eeede7"> = </tspan><tspan fill="#fbbf24">sanitize</tspan><tspan fill="#eeede7">(</tspan></text>
      <text x="290" y="690"><tspan fill="#fbbf24">render</tspan><tspan fill="#eeede7">(source)</tspan></text>
      <text x="250" y="740" fill="#eeede7">);</text>
      <text x="250" y="790" fill="#6b6b63">// scripts never run</text>
    </g>
    <line x1="1060" y1="200" x2="1060" y2="890" stroke="#2a2a30" stroke-width="2"/>
    <text x="1100" y="270" fill="#9d9d95" font-family="monospace" font-size="18" letter-spacing="2">ON THIS PAGE</text>
    <g font-size="24">
      <rect x="1096" y="300" width="4" height="40" rx="2" fill="#38bdf8"/>
