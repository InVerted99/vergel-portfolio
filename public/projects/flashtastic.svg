<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Phone showing stacked flashcards for three question types">
  <defs>
    <radialGradient id="g" cx="62%" cy="40%" r="58%">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".5"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c20"/><stop offset="1" stop-color="#111113"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="#0a0a0b"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect width="1600" height="1000" fill="url(#g)"/>
  <g font-family="Arial, sans-serif">
    <g transform="translate(860 170) rotate(8)">
      <rect width="520" height="300" rx="36" fill="#1c1c20" stroke="#2a2a30" stroke-width="3"/>
      <text x="40" y="70" fill="#38bdf8" font-family="monospace" font-size="20" letter-spacing="3">TRUE / FALSE</text>
      <text x="40" y="140" fill="#eeede7" font-size="34" font-weight="700">HTML5 is a</text>
      <text x="40" y="184" fill="#eeede7" font-size="34" font-weight="700">programming language.</text>
      <rect x="40" y="220" width="200" height="50" rx="25" fill="#0a0a0b" stroke="#2a2a30"/>
      <text x="140" y="253" text-anchor="middle" fill="#eeede7" font-size="22">True</text>
      <rect x="260" y="220" width="200" height="50" rx="25" fill="#38bdf8"/>
      <text x="360" y="253" text-anchor="middle" fill="#0a0a0b" font-size="22" font-weight="700">False</text>
    </g>
    <g transform="translate(820 540) rotate(-5)">
      <rect width="560" height="320" rx="36" fill="#1c1c20" stroke="#2a2a30" stroke-width="3"/>
      <text x="40" y="70" fill="#fbbf24" font-family="monospace" font-size="20" letter-spacing="3">MULTIPLE CHOICE</text>
      <text x="40" y="130" fill="#eeede7" font-size="32" font-weight="700">Which hook stores state?</text>
      <g font-size="22" fill="#9d9d95">
        <rect x="40" y="160" width="230" height="52" rx="18" fill="#0a0a0b" stroke="#2a2a30"/><text x="64" y="194">useEffect</text>
        <rect x="290" y="160" width="230" height="52" rx="18" fill="#fbbf24"/><text x="314" y="194" fill="#0a0a0b" font-weight="700">useState</text>
        <rect x="40" y="228" width="230" height="52" rx="18" fill="#0a0a0b" stroke="#2a2a30"/><text x="64" y="262">useRef</text>
        <rect x="290" y="228" width="230" height="52" rx="18" fill="#0a0a0b" stroke="#2a2a30"/><text x="314" y="262">useMemo</text>
      </g>
    </g>
  </g>
  <g transform="translate(240 100) rotate(-4)" font-family="Arial, sans-serif">
    <rect width="420" height="820" rx="56" fill="url(#phone)" stroke="#2a2a30" stroke-width="4"/>
    <rect x="150" y="26" width="120" height="22" rx="11" fill="#0a0a0b"/>
    <text x="40" y="120" fill="#9d9d95" font-family="monospace" font-size="20" letter-spacing="3">IDENTIFICATION</text>
    <text x="40" y="180" fill="#eeede7" font-weight="700" font-size="40">Card 12 of 40</text>
    <rect x="40" y="206" width="340" height="10" rx="5" fill="#0a0a0b"/>
    <rect x="40" y="206" width="102" height="10" rx="5" fill="#a78bfa"/>
    <rect x="40" y="250" width="340" height="300" rx="32" fill="#a78bfa"/>
    <text x="70" y="320" fill="#0a0a0b" font-size="28" font-weight="700">The design tool used</text>
    <text x="70" y="358" fill="#0a0a0b" font-size="28" font-weight="700">for wireframes and</text>
    <text x="70" y="396" fill="#0a0a0b" font-size="28" font-weight="700">prototypes.</text>
    <text x="70" y="510" fill="#0a0a0b" fill-opacity=".6" font-size="20">Tap to flip</text>
    <rect x="40" y="580" width="340" height="70" rx="35" fill="#0a0a0b" stroke="#2a2a30"/>
    <text x="70" y="624" fill="#9d9d95" font-size="22">Type your answer...</text>
    <rect x="24" y="700" width="372" height="90" rx="32" fill="#0a0a0b" stroke="#2a2a30"/>
    <g fill="#9d9d95"><circle cx="90" cy="745" r="10"/><circle cx="250" cy="745" r="10"/><circle cx="330" cy="745" r="10"/></g>
    <circle cx="170" cy="745" r="22" fill="#a78bfa" fill-opacity=".25"/><circle cx="170" cy="745" r="10" fill="#a78bfa"/>
  </g>
</svg>
